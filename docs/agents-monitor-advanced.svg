<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Agents Monitor advanced view</title>
<desc id="desc">English interface preview showing quota history, session usage, and recent agents.</desc>
<rect width="1200" height="920" rx="28" fill="#090b0f"/>
<rect x="1" y="1" width="1198" height="918" rx="27" fill="none" stroke="#2b3038"/>
<g font-family="Segoe UI, Inter, Arial, sans-serif">
  <text x="38" y="58" fill="#f7f8fb" font-size="31" font-weight="800" letter-spacing="1.5">AGENTS MONITOR</text>
  <g transform="translate(760 24)">
    <rect width="210" height="48" rx="14" fill="#171a1f"/>
    <text x="20" y="31" fill="#758090" font-size="19" font-weight="700">Easy</text>
    <rect x="62" y="4" width="98" height="40" rx="11" fill="#35383f"/>
    <text x="77" y="31" fill="#ffffff" font-size="19" font-weight="800">Advanced</text>
    <text x="178" y="31" fill="#7a8593" font-size="18" font-weight="700">EN</text>
  </g>

  <rect x="30" y="96" width="1140" height="398" rx="26" fill="#15171b" stroke="#30353d"/>
